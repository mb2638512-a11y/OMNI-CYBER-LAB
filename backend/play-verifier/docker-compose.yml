services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: omni
    volumes:
      - play_verifier_db:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omni"]
      interval: 5s
      timeout: 3s
      retries: 20

  verifier:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      OMNI_VERIFIER_API_KEY: ${OMNI_VERIFIER_API_KEY:?Set OMNI_VERIFIER_API_KEY in .env}
      DATABASE_URL: postgres://omni:${POSTGRES_PASSWORD}@db:5432/omni?sslmode=disable
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:?Set GOOGLE_PLAY_SERVICE_ACCOUNT_JSON in .env}
      ALLOWED_PACKAGE_NAMES: ${ALLOWED_PACKAGE_NAMES:?Set ALLOWED_PACKAGE_NAMES in .env}
      ALLOWED_PRODUCT_IDS: ${ALLOWED_PRODUCT_IDS:?Set ALLOWED_PRODUCT_IDS in .env}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  play_verifier_db:
