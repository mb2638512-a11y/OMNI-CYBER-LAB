name: Play verifier CI
on:
  push:
    paths:
      - "backend/play-verifier/**"
      - ".github/workflows/play-verifier.yml"
  pull_request:
    paths:
      - "backend/play-verifier/**"
      - ".github/workflows/play-verifier.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/play-verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
          cache-dependency-path: backend/play-verifier/go.mod
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
