name: Publish Android APK Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish GitHub release with direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0
          name: OMNI CYBER LAB v0.8.0
          body: |
            First installable Android debug build of OMNI CYBER LAB.

            Includes installed-app inventory and Shizuku connection/permission interface.
            Advanced privileged diagnostics are still under development.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
