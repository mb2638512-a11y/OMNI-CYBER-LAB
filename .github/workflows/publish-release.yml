name: Publish Android APK Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish GitHub release with direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0
          name: OMNI CYBER LAB v0.9.0
          body: |
            OMNI CYBER LAB v0.9.0 — Android debug APK.

            Includes installed-app and APK inventory, static security orchestration, owner-authorized APK resource engineering companion workflows, Shizuku read-only diagnostics, adversarial purchase and virtual-economy QA simulations, evidence reports, and expanded automated regression tests.

            Android resource rebuild is provided by the Termux ARM64 companion and rebuilds resources/manifest only; DEX rebuilding is not included. Live third-party payment, VIP, license or ad bypass is not supported. Backend purchase verification is intended for apps and products owned by the operator.

            Build and unit-test status is recorded in GitHub Actions. Physical-device install/runtime validation remains a separate manual test.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
