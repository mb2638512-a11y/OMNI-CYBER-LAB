name: Publish Android APK Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish GitHub release with direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.13.0
          name: LUCKY PATCHES v0.13.0
          body: |
            LUCKY PATCHES v0.13.0 — Android debug APK.

            Includes installed-app and APK inventory, static security orchestration, Shizuku read-only diagnostics, 12 adversarial purchase and virtual-economy QA scenarios, evidence reports, strict Play verifier request parsing, and expanded Android regression tests.

            Full on-device Apktool decode/rebuild is available through the Termux ARM64 companion. It decodes DEX into Smali and rebuilds Smali into DEX alongside resources and manifest. Output is unsigned until signed with the owner's keystore. Use only APKs you own or are explicitly authorized to test.

            Live third-party payment, VIP, license or ad bypass is not included. The purchase-security labs support local exploit simulation and authorized staging/test-account validation. Physical-device install/runtime validation remains a separate manual test.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
