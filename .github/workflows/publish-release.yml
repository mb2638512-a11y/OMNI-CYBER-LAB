name: Publish Android APK Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: write

concurrency:
  group: lucky-patches-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Publish GitHub release with direct APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.13.0
          name: LUCKY PATCHES v0.13.0
          body: |
            LUCKY PATCHES v0.13.0 — Android debug APK.

            Adds an owner-authorized ad-config APK patcher for supported text flags under assets/ and res/raw/, with unsigned APK rebuild, stale-signature removal, SHA-256 and before/after ZIP diff. It also includes installed-app inventory, APK inspection, security QA, Shizuku read-only diagnostics, purchase/license simulations and evidence reports.

            The ad-config patch changes only exact owner-controlled configuration flags. The app must actually read those flags for its ad behavior to change. It does not strip third-party ad SDK code or bypass another developer's monetization. Full Apktool decode/rebuild remains available through the Termux ARM64 companion. Sign with your own keystore and validate on a controlled device; physical-device runtime validation is not claimed.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
